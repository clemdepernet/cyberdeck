<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · Cyberdeck</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/theme.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 0%, #22252c 0%, var(--bg) 60%); }
    .login { width: min(380px, calc(100vw - 32px)); padding: 28px 28px 24px; display: grid; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--amber); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
    .brand svg { width: 30px; height: 30px; }
    .lead { color: var(--text-muted); font-size: 13px; }
    label { display: grid; gap: 5px; font-size: 12px; }
    input { width: 100%; }
    .btn { justify-content: center; margin-top: 4px; }
    .err { color: var(--red); font-size: 13px; min-height: 18px; }
    .foot { color: var(--text-dim); font-size: 11.5px; }
  </style>
</head>
<body>
  <form class="panel login" method="post" action="/login" autocomplete="on">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 13h6M8 17h10M8 21h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="23" cy="13" r="2" fill="currentColor"/></svg>
      cyberdeck
    </div>
    <p class="lead">Le deck est privé. Relay et Dead Drop restent ouverts ; tout le reste demande d'entrer.</p>
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Identifiant <input type="text" name="user" class="mono" required autofocus autocomplete="username" spellcheck="false"></label>
    <label>Mot de passe <input type="password" name="password" class="mono" required autocomplete="current-password"></label>
    <p class="err">{{.Error}}</p>
    <button class="btn primary" type="submit">Entrer</button>
    <p class="foot">Session de 30 jours sur ce navigateur. En ligne de commande : <code>curl -u identifiant:mot_de_passe</code>.</p>
  </form>
</body>
</html>
