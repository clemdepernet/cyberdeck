# Cyberdeck front door. Every tool contributes its own `location` blocks through
# tools/<id>/nginx.conf, included below, so adding a tool never touches this file.
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 64m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Real client IP when behind Cloudflare / a reverse proxy on the same host.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  map $http_accept $wants_raw { default 0; "~*text/plain" 1; }
  map $http_user_agent $is_cli { default 0; "~*^(curl|wget|httpie|python-requests|powershell)" 1; }

  server {
    listen 8080;
    server_name _;
    root /app/shell;
    absolute_redirect off;

    include /etc/nginx/auth.conf;   # written by entrypoint.sh: turns auth_request on when APP_PASSWORD is set

    # The gate (gate/main.go) answers auth_request and serves the login page.
    location = /gate/check {
      internal;
      auth_request off;
      proxy_pass http://127.0.0.1:8100/gate/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
    }
    location ~ ^/(login|logout|gate/status)$ {
      auth_request off;
      proxy_pass http://127.0.0.1:8100;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    # Browsers are sent to the login page, API calls get a 401 they can show.
    location @login {
      if ($http_accept ~* "text/html") { return 302 /login?next=$uri; }
      default_type application/json;
      return 401 '{"error":"connexion requise"}';
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    location = / { try_files /index.html =404; }
    location = /tools.json { add_header Cache-Control no-cache; }
    location ~ ^/(index\.html|app\.js|app\.css|deck\.js|theme\.css|favicon\.svg)$ { add_header Cache-Control "no-cache"; }

    # Short link for pastes: humans get the UI, curl/wget get the raw text.
    location ~ "^/p/(?<code>[A-Za-z0-9]{4,12})$" {
      if ($wants_raw) { rewrite ^ /paste/api/pastes/$code/raw last; }
      if ($is_cli)    { rewrite ^ /paste/api/pastes/$code/raw last; }
      return 302 /#paste?code=$code;
    }

    include /app/tools/*/nginx.conf;
  }
}
