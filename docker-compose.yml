# Example deployment. Copy next to your other stacks, adjust the port and PUBLIC_URL.
services:
  toolbox:
    image: ghcr.io/clemdepernet/cyberdeck:latest
    build: .
    container_name: toolbox
    ports:
      - "7850:8080"
    volumes:
      - ./data:/data
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=1000
      - PUBLIC_URL=https://toolbox.example.com   # used in paste links and QR codes
      # - HIBP_API_KEY=${HIBP_API_KEY}            # optional: e-mail lookups in Fuites
      # - VT_API_KEY=${VT_API_KEY}                # optional: VirusTotal reports in Verdict
      # - APP_USER=me                             # optional: login name (default toolbox)
      # - APP_PASSWORD=change-me                  # optional: login page in front of the deck; short links and paste reading stay public
    restart: unless-stopped
