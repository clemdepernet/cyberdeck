[program:verdict]
command=/opt/verdict/bin/uvicorn app:app --host 127.0.0.1 --port 8108 --workers 1
directory=/app/tools/verdict
user=deck
environment=VT_API_KEY="%(ENV_VT_API_KEY)s"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
