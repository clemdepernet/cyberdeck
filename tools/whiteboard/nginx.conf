location /whiteboard/api/ {
  proxy_pass http://127.0.0.1:8102;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Deck-User $deck_user;
  proxy_set_header X-Deck-Role $deck_role;
  proxy_read_timeout 60s;
}
location /whiteboard/ {
  alias /app/tools/whiteboard/dist/;
  try_files $uri $uri/ /whiteboard/index.html;
  location ~* \.(js|css|woff2?|ttf|png|svg)$ { expires 7d; add_header Cache-Control public; }
}
