location /links/ {
  proxy_pass http://127.0.0.1:8106;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Deck-User $deck_user;
  proxy_set_header X-Deck-Role $deck_role;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
# Short links stay reachable by anyone: the gate lists /s/<slug> as public.
location ~ "^/s/[A-Za-z0-9_-]{2,32}$" {
  proxy_pass http://127.0.0.1:8106;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
