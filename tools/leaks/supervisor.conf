[program:leaks]
command=/opt/leaks/bin/uvicorn app:app --host 127.0.0.1 --port 8107 --workers 1
directory=/app/tools/leaks
user=deck
environment=HIBP_API_KEY="%(ENV_HIBP_API_KEY)s"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
