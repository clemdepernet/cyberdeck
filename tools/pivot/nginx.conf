location /pivot/api/ {
  proxy_pass http://127.0.0.1:8105;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  client_max_body_size 64m;
}
location /pivot/ {
  alias /app/tools/pivot/dist/;
  try_files $uri $uri/ /pivot/index.html;
  location ~* \.(js|css|woff2?|png|svg)$ { expires 7d; add_header Cache-Control public; }
}
